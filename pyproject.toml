[project]
name = "pinkass-kiss"
version = "0.1.0"
description = "Lean knowledge base (OKF-inspired) backed by Postgres"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "langgraph>=1.0", "langchain-anthropic>=1.0", "langchain-ollama>=1.0", "langchain-openai>=1.0", "opik>=2.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["llm: calls a real LLM (Anthropic: needs ANTHROPIC_API_KEY, costs money; or a local Ollama / OpenAI-compatible server)"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
